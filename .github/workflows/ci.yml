name: CI

on:
  push:
    branches: [main, rewrite/typescript-v2]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["20", "22"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify CLI
        run: node dist/cli.js version

      - name: Smoke — environment lifecycle
        run: |
          export SKILLENV_HOME=$(mktemp -d)
          node dist/cli.js create smoke --preset clean
          node dist/cli.js doctor smoke
          node dist/cli.js export smoke
          node dist/cli.js remove smoke
